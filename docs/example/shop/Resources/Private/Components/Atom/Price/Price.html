<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:argument name="amount" type="float" />
<f:argument name="currency" type="string" optional="{true}" default="€" />

<span class="a-price"><f:format.currency currencySign="{currency}" decimals="2">{amount}</f:format.currency></span>
</html>
